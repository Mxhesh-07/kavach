version: "3.9"

# ==============================================================================
# IBVAP Production Orchestration Stack — NVIDIA GPU Accelerated
# ==============================================================================

services:
  ibvap-edge:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ibvap-edge-node
    image: ibvap:production-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/alerts.db
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - INFERENCE_BATCH_MAX=4
      - INFERENCE_BATCH_TIMEOUT_MS=2.0
    volumes:
      # Persistent forensic alert data & evidence retention
      - ibvap-data:/app/data
      - ./alerts:/app/alerts
      - ./clips:/app/clips
      - ./videos:/app/videos
      - ./static:/app/static
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ibvap-edge-net

volumes:
  ibvap-data:
    name: ibvap-prod-data

networks:
  ibvap-edge-net:
    name: ibvap-edge-net
    driver: bridge
